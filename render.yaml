services:
  # NOTE: type is "web", not "worker" — the bot needs to accept inbound
  # HTTP for the instant Google Sheets webhook (core/webhook.py). It still
  # runs the same aiogram long-polling loop as before, plus a tiny aiohttp
  # server bound to $PORT alongside it (see main.py).
  - type: web
    name: logistics-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: POLL_INTERVAL_SECONDS
        value: "180"
      # Shared secret with the Google Apps Script onEdit trigger — set this
      # to a random string, and put the SAME string in the Apps Script.
      - key: SHEET_WEBHOOK_SECRET
        sync: false

  - type: web
    name: logistics-dashboard
    env: python
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
